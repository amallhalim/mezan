name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Prevent concurrent runs on the same branch/PR to optimize build resources
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Disable Husky checks during CI execution
  HUSKY: 0
  # Ensure Next.js build is optimized and doesn't send telemetry
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Lint, Type Check & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Prettier Check
        run: npm run prettier:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Type Check
        run: npm run type-check

      - name: Run Unit Tests
        run: npm run test

  cypress-e2e:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: validate # Only run E2E if unit verification passes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Cypress Github Action handles caching of Cypress binary and running/waiting for the server
      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          # Next.js app needs to be built before running the production start script
          build: npm run build
          # Start the server on port 3001, matching Cypress baseUrl/tests configuration
          start: npm run start -- -p 3001
          # Wait for the server to be ready on port 3001 before starting tests
          wait-on: "http://localhost:3001"
          wait-on-timeout: 120
          command: npm run cy:run
